<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>今日の復習 — KOTOBA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="review">
  <header class="navbar"><div class="container nav-inner"><a class="brand" href="dashboard.html"><span class="brand-mark">こ</span>KOTOBA</a><nav class="nav-links"><a href="dashboard.html">ホーム</a><a href="roadmap.html">学習</a><a href="biology.html">生物で学ぶ</a><a class="active" href="review.html">復習</a><a href="conversation.html">会話</a><a href="progress.html">進捗</a></nav><div class="nav-actions"><button class="icon-btn" data-focus>静</button><a class="avatar" href="profile.html">私</a></div></div></header>
  <section class="page-hero"><div class="container"><span class="eyebrow">間隔反復</span><h1>今日の復習</h1><p>授業・辞書・会話で出会った語を、形を変えながら思い出します。</p></div></section>
  <main class="section">
    <div class="container review-layout">
      <section>
        <div class="review-heading"><span class="muted">今日のカード</span><b id="reviewPosition">0 / 0</b></div>
        <article class="card flashcard" id="flashcard"></article>
        <div class="flash-actions" id="reviewActions">
          <button class="btn btn-danger-soft" id="rateAgain">もう一度</button>
          <button class="btn btn-secondary" id="rateHard">難しい</button>
          <button class="btn btn-success" id="rateGood">わかった</button>
        </div>
        <p class="form-error hidden" id="reviewError" role="alert"></p>
      </section>
      <aside class="review-sidebar">
        <section class="card word-editor" aria-labelledby="addWordTitle">
          <span class="eyebrow">自分の単語</span>
          <h2 id="addWordTitle">単語を追加</h2>
          <p class="muted">日本語と意味を入力すると、今日から復習できます。</p>
          <form id="addWordForm">
            <fieldset id="addWordFields">
              <div class="field"><label for="wordTerm">日本語の単語（必須）</label><input id="wordTerm" name="term" lang="ja" required maxlength="100" placeholder="例：図書館" autocomplete="off"></div>
              <div class="field"><label for="wordReading">読み方（任意）</label><input id="wordReading" name="reading" lang="ja" maxlength="100" placeholder="例：としょかん" autocomplete="off"></div>
              <div class="field"><label for="wordMeaning">意味（必須）</label><input id="wordMeaning" name="meaning" required maxlength="500" placeholder="単語の意味を入力してください" autocomplete="off"></div>
              <div class="field"><label for="wordExample">例文（任意）</label><textarea id="wordExample" name="example" lang="ja" rows="3" maxlength="1000" placeholder="例：図書館で本を読みます。"></textarea></div>
              <button class="btn btn-primary" id="addWordSubmit" type="submit">カードに追加</button>
            </fieldset>
            <p class="form-error hidden" id="addWordError" role="alert"></p>
            <p class="word-status" id="addWordStatus" role="status" aria-live="polite"></p>
          </form>
        </section>
        <section class="card deck-list"><span class="eyebrow">今日の単語</span><h3>学習から集まった語</h3><p class="muted">辞書で調べた語も自動でここに入ります。</p><div id="deckList"></div></section>
      </aside>
    </div>
  </main>
  <script src="dictionary-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
