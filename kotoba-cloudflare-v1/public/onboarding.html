<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>学習プラン — KOTOBA</title><link rel="stylesheet" href="styles.css"></head><body class="onboarding-page"><div class="onboarding-shell"><a class="brand" href="index.html"><span class="brand-mark">こ</span>KOTOBA</a><div class="stepper"><div class="step-dot active">1</div><div class="step-dot">2</div><div class="step-dot">3</div><div class="step-dot">4</div></div><form id="onboardingForm" class="card onboard-card"><section class="onboard-step" data-step="1"><span class="eyebrow">01 レベル</span><h1>今の日本語レベルは？</h1><div class="choice-grid"><button type="button" class="choice selected" data-group="level" data-value="N5"><b>N5</b><div class="muted">基礎から学びたい</div></button><button type="button" class="choice" data-group="level" data-value="N4"><b>N4</b><div class="muted">基本表現を広げたい</div></button><button type="button" class="choice" data-group="level" data-value="初めて"><b>日本語は初めて</b></button><button type="button" class="choice" data-group="level" data-value="わからない"><b>わからない</b><div class="muted">あとで確認する</div></button></div></section><section class="onboard-step hidden" data-step="2"><span class="eyebrow">02 目的</span><h1>何のために日本語を学びますか？</h1><div class="choice-grid"><button type="button" class="choice selected" data-group="goal" data-value="JLPT"><b>JLPT</b></button><button type="button" class="choice" data-group="goal" data-value="会話"><b>日常会話</b></button><button type="button" class="choice" data-group="goal" data-value="学校"><b>学校・留学</b></button><button type="button" class="choice" data-group="goal" data-value="文化"><b>日本文化</b></button></div></section><section class="onboard-step hidden" data-step="3"><span class="eyebrow">03 Kaizen</span><h1>毎日どのくらい学びますか？</h1><p class="muted">短くても、毎日続けることを優先します。</p><div class="choice-grid"><button type="button" class="choice" data-group="minutes" data-value="10"><b>10分</b></button><button type="button" class="choice selected" data-group="minutes" data-value="20"><b>20分</b></button><button type="button" class="choice" data-group="minutes" data-value="30"><b>30分</b></button><button type="button" class="choice" data-group="minutes" data-value="45"><b>45分</b></button></div></section><section class="onboard-step hidden" data-step="4"><span class="eyebrow">04 Shukan</span><h1>学習する時間を決めましょう。</h1><div class="field"><label>いつ勉強しますか？</label><input id="studyTime" type="time" value="20:30"></div><label style="display:flex;gap:10px;align-items:flex-start;margin-top:20px"><input id="bioInterest" type="checkbox" checked><span><b>生物で日本語を学ぶコースにも興味があります</b><div class="muted">あとからいつでも変更できます。</div></span></label></section><div style="display:flex;justify-content:space-between;margin-top:26px"><button id="prevStep" type="button" class="btn btn-secondary hidden">戻る</button><button id="nextStep" type="button" class="btn btn-primary" style="margin-left:auto">次へ</button></div></form></div><script src="dictionary-data.js"></script><script src="app.js"></script></body></html>
