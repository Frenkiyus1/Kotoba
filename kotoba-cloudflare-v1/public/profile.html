<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>設定 — KOTOBA</title><link rel="stylesheet" href="styles.css"></head><body data-page="profile">
<header class="navbar"><div class="container nav-inner"><a class="brand" href="dashboard.html"><span class="brand-mark">こ</span>KOTOBA</a><nav class="nav-links"><a href="dashboard.html">ホーム</a><a href="roadmap.html">学習</a><a href="biology.html">生物で学ぶ</a><a href="review.html">復習</a><a href="conversation.html">会話</a><a href="progress.html">進捗</a></nav><div class="nav-actions"><a class="avatar" href="profile.html">私</a></div></div></header>
<section class="page-hero"><div class="container"><span class="eyebrow">私</span><h1>学習設定</h1><p>自分の生活に合わせて、無理のない学習習慣を作ります。</p></div></section><main class="section"><div class="container"><div class="card settings-card"><div class="setting-row"><b>名前</b><input id="profileName" style="padding:10px;border:1px solid var(--border);border-radius:9px"></div><div class="setting-row"><b>メールアドレス</b><input id="profileEmail" type="email" readonly style="padding:10px;border:1px solid var(--border);border-radius:9px"></div><div class="setting-row"><b>日本語レベル</b><select id="profileLevel" style="padding:10px;border:1px solid var(--border);border-radius:9px"><option>N5</option><option>N4</option><option>N3</option></select></div><div class="setting-row"><b>毎日の目標</b><select id="profileMinutes" style="padding:10px;border:1px solid var(--border);border-radius:9px"><option value="10">10分</option><option value="20">20分</option><option value="30">30分</option><option value="45">45分</option></select></div><div class="setting-row"><b>学習する時間</b><input id="profileTime" type="time" style="padding:10px;border:1px solid var(--border);border-radius:9px"></div><div class="setting-row"><b>ふりがな</b><select style="padding:10px;border:1px solid var(--border);border-radius:9px"><option>必要なときだけ</option><option>いつも表示</option><option>表示しない</option></select></div><div class="setting-row"><b>ベトナム語のヒント</b><select style="padding:10px;border:1px solid var(--border);border-radius:9px"><option>少ない</option><option>普通</option><option>多い</option></select></div><div style="display:flex;gap:10px;margin-top:20px"><button id="profileSave" class="btn btn-primary">保存する</button><button id="logoutBtn" class="btn btn-secondary" type="button">ログアウト</button></div></div></div></main><script src="dictionary-data.js"></script><script src="app.js"></script></body></html>
