<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>日本語レベル — KOTOBA</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .level-onboarding{max-width:900px;margin:0 auto;padding:56px 24px}.level-onboarding .intro{text-align:center;margin-bottom:28px}.level-onboarding h1{margin:10px 0;font-size:clamp(30px,5vw,48px)}.level-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:28px 0}.level-card{appearance:none;border:1px solid var(--border);border-radius:18px;background:var(--paper);padding:24px 12px;text-align:center;cursor:pointer;transition:.18s ease;color:inherit}.level-card:hover{transform:translateY(-2px)}.level-card.selected{border:2px solid var(--vermilion);background:var(--soft);box-shadow:0 10px 30px rgba(0,0,0,.06)}.level-card b{display:block;font-size:30px;margin-bottom:7px}.level-card small{display:block;line-height:1.55;color:var(--muted)}.support-vi{color:var(--vermilion)!important}.support-ja{color:var(--indigo)!important}.onboard-error{margin-top:14px;color:var(--danger);text-align:center}.onboard-note{text-align:center;color:var(--muted);margin-top:18px}.level-submit{display:flex;justify-content:center;margin-top:28px}.level-submit .btn{min-width:260px}@media(max-width:760px){.level-grid{grid-template-columns:1fr 1fr}.level-card:last-child{grid-column:1/-1}.level-onboarding{padding:32px 16px}}
  </style>
</head>
<body class="onboarding-page" data-page="onboarding">
  <main class="level-onboarding">
    <a class="brand" href="index.html"><span class="brand-mark">こ</span>KOTOBA</a>

    <section class="card onboard-card" style="margin-top:28px">
      <div class="intro">
        <span class="eyebrow">はじめに</span>
        <h1>あなたの日本語レベルを教えてください。</h1>
        <p class="muted">学習内容とサポートをあなたに合わせて調整します。</p>
      </div>

      <form id="onboardingForm">
        <div class="level-grid" id="levelGrid">
          <button type="button" class="level-card choice" aria-pressed="false" data-value="N5">
            <b>N5</b>
            <small>はじめて・入門</small>
            <small class="support-vi">ベトナム語サポート付き</small>
          </button>
          <button type="button" class="level-card choice" aria-pressed="false" data-value="N4">
            <b>N4</b>
            <small>基礎</small>
            <small class="support-vi">ベトナム語サポート付き</small>
          </button>
          <button type="button" class="level-card choice" aria-pressed="false" data-value="N3">
            <b>N3</b>
            <small>中級</small>
            <small class="support-ja">日本語のみ</small>
          </button>
          <button type="button" class="level-card choice" aria-pressed="false" data-value="N2">
            <b>N2</b>
            <small>上級</small>
            <small class="support-ja">日本語のみ</small>
          </button>
          <button type="button" class="level-card choice" aria-pressed="false" data-value="N1">
            <b>N1</b>
            <small>高度</small>
            <small class="support-ja">日本語のみ</small>
          </button>
        </div>

        <div class="level-submit">
          <button id="nextStep" disabled class="btn btn-primary" type="submit">このレベルで始める</button>
        </div>

        <p class="onboard-note">レベルはあとでプロフィールから変更できます。</p>
        <p id="onboardingError" class="onboard-error hidden" role="alert"></p>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
